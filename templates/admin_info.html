{% extends 'base.html' %}
{% load static %}

{% block title %}Администратор — Свет Сунны{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/admin_info.css' %}">
{% endblock %}

{% block content %}
<div class="admin-page">
    <div class="admin-card">
        <div class="admin-avatar">
            <img src="{% static 'img/admin-pic.jpeg' %}" alt="Администратор">
        </div>
        <h1>{{ admin.name }}</h1>
        <p class="admin-about">{{ admin.about }}</p>

        <div class="admin-contacts">
            <a href="{{ admin.telegram }}" target="_blank" class="admin-contact-btn">
                <i class="fab fa-telegram"></i> Telegram
            </a>
            <a href="{{ admin.youtube }}" target="_blank" class="admin-contact-btn">
                <i class="fab fa-youtube"></i> YouTube
            </a>
        </div>
    </div>
</div>
{% endblock %}
